<html lang="en">
<head>

<title>Terpene Sommelier — Quiz Report</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{--dark:#212529;--grey:#6e747a;--line:#e1e4e6;--card:#f7f9fa;--green:#167a3c;--red:#c4302b;--teal:#4aabbf;}
  *{box-sizing:border-box;-webkit-print-color-adjust:exact;print-color-adjust:exact;}
  html,body{margin:0;padding:0;background:#eceff1;font-family:'DM Sans',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:var(--dark);}
  .sheet{max-width:820px;margin:24px auto;background:#fff;box-shadow:0 2px 18px rgba(0,0,0,.12);}
  .head{background:var(--dark);color:#fff;padding:22px 34px;}
  .head h1{margin:0;font-size:22px;font-weight:700;}
  .head p{margin:3px 0 0;font-size:12px;color:#c7d0d4;font-weight:500;}
  .body{padding:26px 34px 40px;}
  .summary{display:flex;justify-content:space-between;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px 20px;margin-bottom:22px;}
  .who .name{font-size:17px;font-weight:700;}
  .who .meta{font-size:13px;color:var(--grey);margin-top:3px;font-weight:500;}
  .score{text-align:right;line-height:1;}
  .score .n{font-size:34px;font-weight:700;}
  .score .r{font-size:13px;font-weight:700;letter-spacing:1px;margin-top:4px;}
  .pass .n,.pass .r{color:var(--dark);} .fail .n,.fail .r{color:var(--red);}
  .q{margin-bottom:15px;padding-bottom:13px;border-bottom:1px solid var(--line);}
  .q:last-child{border-bottom:none;}
  .q .text{font-size:14px;font-weight:700;line-height:1.35;}
  .ans{font-size:13px;line-height:1.4;margin-top:6px;display:flex;gap:7px;}
  .tag{font-weight:700;white-space:nowrap;}
  .ans.ok{color:var(--green);} .ans.no{color:var(--red);}
  .correct{color:var(--green);font-size:13px;line-height:1.4;margin-top:3px;}
  .foot{padding:14px 34px 26px;color:var(--grey);font-size:11px;display:flex;justify-content:space-between;border-top:1px solid var(--line);}
  .printbar{max-width:820px;margin:12px auto 0;text-align:right;}
  .printbar button{font-family:inherit;font-size:13px;font-weight:600;cursor:pointer;background:var(--teal);color:#fff;border:none;border-radius:8px;padding:9px 16px;}
  @media print{
    body{background:#fff;}
    .sheet{box-shadow:none;margin:0;max-width:none;}
    .printbar{display:none;}
    @page{size:letter;margin:10mm;}
    .head{padding:14px 26px;} .head h1{font-size:17px;} .head p{font-size:9px;}
    .body{padding:16px 26px;}
    .summary{padding:10px 16px;margin-bottom:12px;}
    .who .name{font-size:14px;} .who .meta{font-size:10px;}
    .score .n{font-size:24px;} .score .r{font-size:10px;}
    .q{margin-bottom:8px;padding-bottom:7px;}
    .q .text{font-size:11px;line-height:1.25;}
    .ans{font-size:10px;line-height:1.25;margin-top:3px;}
    .correct{font-size:10px;line-height:1.25;}
  }
</style>
</head>

<script>
const BANKS = {
 "1":[
  {t:"When Linnaeus first classified cannabis as Cannabis sativa in 1753, what was he describing?",A:"The plant's psychoactive effects on humans",B:"The plant's physical shape and traits as a crop",C:"The plant's chemistry and cannabinoid content",D:"The plant's traditional medicinal uses in Europe",correct:"B"},
  {t:"A customer asks for \"an Indica for sleep.\" What's the best Sommelier approach?",A:"Find any Indica-labeled product on the shelf",B:"Explain that Indicas don't actually exist as a category",C:"Look for sedating chemistry regardless of the SPECIES label",D:"Recommend a Sativa to challenge their belief",correct:"C"},
  {t:"Why do customers often feel that \"Indicas put them to sleep\"?",A:"The Indica label has a direct chemical effect",B:"Many \"Indica\" strains happen to be high in Myrcene",C:"Indica plants release a unique sedating compound",D:"All Indicas share an identical genetic profile",correct:"B"},
  {t:"Major studies like Sawler (2015) and Mudge (2018) generally found that:",A:"Indica plants have measurably higher THC than Sativas",B:"Sativa plants contain terpenes that Indicas lack",C:"Indica and Sativa labels don't reliably predict chemistry",D:"The labels do predict effects, just not chemistry",correct:"C"},
  {t:"A customer says: \"I had a Sativa once and it gave me bad anxiety.\" What's the best response?",A:"\"That's not how Sativas usually work — bad batch.\"",B:"\"The labels are meaningless, so it was probably random.\"",C:"\"The chemistry — likely high terpinolene — caused that, not the label.\"",D:"\"Maybe cannabis just isn't for you.\"",correct:"C"},
 ],
 "2":[
  {t:"The primary function of the endocannabinoid system (ECS) in humans is:",A:"Detecting and responding to cannabis compounds",B:"Maintaining homeostasis across body systems",C:"Processing aromatic compounds like terpenes",D:"Regulating only the brain's reward circuits",correct:"B"},
  {t:"Which best describes CB1 vs CB2 receptors?",A:"CB1 responds to THC; CB2 responds to CBD",B:"CB1 is in adults; CB2 is in children",C:"CB1 is mainly in the brain; CB2 is mainly in immune tissue",D:"CB1 controls mood; CB2 controls appetite",correct:"C"},
  {t:"How does CBD interact with the CB1 receptor?",A:"As a strong agonist, activating it directly",B:"As a negative allosteric modulator, dampening THC's effect",C:"As a complete blocker, preventing all activity",D:"As a metabolite, breaking it down over time",correct:"B"},
  {t:"The endocannabinoid anandamide was discovered in:",A:"1964 by Raphael Mechoulam",B:"1992 by Devane, Hanuš, and Mechoulam",C:"1998 by Ben-Shabat and Mechoulam",D:"2011 by Ethan Russo",correct:"B"},
  {t:"Why is the entourage effect important for Sommelier practice?",A:"It proves whole-plant cannabis cures more conditions than isolates",B:"It means THC is the only molecule that matters",C:"It explains why two products with similar THC can feel different",D:"It shows that terpenes have no real pharmacological role",correct:"C"},
 ],
 "3":[
  {t:"Terpenes are:",A:"Compounds unique to cannabis plants",B:"Synthetic flavoring added during processing",C:"Aromatic molecules found across many plants",D:"A type of cannabinoid produced in the trichomes",correct:"C"},
  {t:"BCLDB lists the top three terpenes for each product. They are reported:",A:"By concentration, highest first",B:"In alphabetical order",C:"By customer popularity",D:"By regulatory priority",correct:"B"},
  {t:"A product's BCLDB trio shows Caryophyllene, Limonene, and Myrcene. What can you confidently conclude?",A:"Caryophyllene is the dominant terpene because it's listed first",B:"The product will be sedating because myrcene is present",C:"These three are the top three terpenes, in unknown ranking",D:"The product is balanced with equal amounts of each",correct:"C"},
  {t:"Which term best describes cannabis varieties classified by chemistry rather than by Indica/Sativa labels?",A:"Cultivar",B:"Chemovar",C:"Phenotype",D:"Landrace",correct:"B"},
  {t:"Why does the platform care so much about terpenes if THC produces the high?",A:"Terpenes are required by law to be disclosed",B:"Terpenes shape the character of the experience",C:"Terpenes increase the legal THC limit",D:"Terpenes determine the product's shelf life",correct:"B"},
 ],
 "4":[
  {t:"Which plant-kingdom connection is correct?",A:"Limonene → lavender → calming",B:"Myrcene → mango → sedating",C:"Pinene → citrus → energizing",D:"Linalool → pine → alert",correct:"B"},
  {t:"A customer wants daytime focus with mental clarity. Which terpene is most useful?",A:"Myrcene",B:"Linalool",C:"Pinene",D:"Humulene",correct:"C"},
  {t:"Which terpene binds directly to the CB2 receptor, giving it cannabinoid-like activity?",A:"Caryophyllene",B:"Pinene",C:"Bisabolol",D:"Ocimene",correct:"A"},
  {t:"Two products both score as \"Indica Leaning.\" The first is Cerebral −2 / Somatic −3, the second is Cerebral −3 / Somatic −4. What's the right read?",A:"They're identical because the Leaning matches",B:"The first is heavier — lower numbers mean less effect",C:"The second is heavier on both axes within the same leaning",D:"They can't be compared because they're in the same leaning",correct:"C"},
  {t:"A customer's product has Terpinolene present in the trio. What should you keep in mind?",A:"Terpinolene reliably produces a sedating effect",B:"Terpinolene is anti-inflammatory through CB2 binding",C:"Terpinolene can push sensitive users into anxiety at high THC",D:"Terpinolene has no documented effect",correct:"C"},
 ],
 "5":[
  {t:"What is \"Stage 1\" of the two-stage reading framework?",A:"Reading the package percentages to find dominance",B:"Reading the BCLDB trio alphabetically without dominance",C:"Reading the COA in full detail",D:"Reading the customer reviews online",correct:"B"},
  {t:"A product's trio is Caryophyllene, Linalool, Myrcene. What's the most confident Stage 1 reading?",A:"Energizing daytime profile",B:"Mixed character — direction depends on dominance",C:"Sedating evening profile",D:"Cannot say anything without percentages",correct:"C"},
  {t:"A product's trio is Limonene, Myrcene, Pinene. What's the right reading?",A:"Clearly sedating because myrcene is present",B:"Clearly energizing because limonene and pinene dominate",C:"Mixed — dominance from percentages determines character",D:"Identical to any limonene-pinene product",correct:"C"},
  {t:"Where can a Sommelier most reliably find which terpene actually dominates a product?",A:"The Indica/Sativa SPECIES label",B:"The package percentages or a COA",C:"The order terpenes appear on BCLDB",D:"The brand's marketing copy",correct:"B"},
  {t:"A product is marked \"Terpenes Varies.\" The best Sommelier response is to:",A:"Refuse to recommend the product",B:"Use SPECIES as a directional estimate and flag the uncertainty to the customer",C:"Assume the dominant terpene is whichever appears first alphabetically",D:"Ignore the warning and treat the listed trio as accurate",correct:"B"},
 ],
 "6":[
  {t:"Terpene Effect Analyzer measures cannabis on how many primary axes?",A:"One — Overall intensity",B:"Two — Cerebral and Somatic",C:"Three — Cerebral, Somatic, and THC",D:"Four — adding Time-of-Day",correct:"B"},
  {t:"What does a Somatic score of −4 indicate?",A:"Strongly body-activating",B:"Strongly body-sedating",C:"Mildly energizing",D:"No body effect",correct:"B"},
  {t:"Why does Terpene Effect Analyzer use two axes instead of a single \"intensity\" score?",A:"Two scores look more sophisticated to customers",B:"Cerebral and Somatic effects can move independently",C:"It's required by BC regulations",D:"It distinguishes Indicas from Sativas more cleanly",correct:"B"},
  {t:"Two products both score as \"Evening Wind-Down.\" The first is Cerebral −2 / Somatic −3, the second is Cerebral −3 / Somatic −4. What's the right read?",A:"They're identical because the Profile Type matches",B:"The first is heavier — lower numbers mean less effect",C:"The second is heavier on both axes within the same category",D:"They can't be compared because they're in the same category",correct:"C"},
  {t:"What is the \"SPECIES nudge\" in the Terpene Effect Analyzer scoring logic?",A:"A small adjustment to scores based on the BCLDB SPECIES label, used when terpene data is incomplete",B:"A penalty applied to all Indica-labeled products",C:"A bonus given to products with full COA data",D:"A regulatory requirement from the LCRB",correct:"A"},
 ],
 "7":[
  {t:"The term \"entourage effect\" was originally coined by:",A:"Dr. Ethan Russo in 2011",B:"Ben-Shabat and Mechoulam in 1998",C:"Raphael Mechoulam in 1964",D:"Sawler et al. in 2015",correct:"B"},
  {t:"Which synergy is well-supported in the literature?",A:"THC + Pinene preserves cognitive clarity",B:"THC + Linalool produces strong appetite stimulation",C:"CBD + Caryophyllene blocks the entourage effect",D:"Limonene + Myrcene cancel each other out entirely",correct:"A"},
  {t:"Marinol (synthetic THC) often feels different from whole-plant cannabis because:",A:"Synthetic THC is chemically different from natural THC",B:"The rest of the chemistry — terpenes and minor cannabinoids — shapes the experience",C:"Marinol contains additives that block THC",D:"Pharmaceutical THC has lower potency by law",correct:"B"},
  {t:"When two terpenes in a product pull in opposite directions, the most likely result is:",A:"Total cancellation of all effects",B:"Modulation — nuanced character rather than cancellation",C:"Doubled intensity in both directions",D:"The product becomes psychoactively inert",correct:"B"},
  {t:"Why does the platform name 46 unique combinations across the catalog?",A:"To give customers a brand-style identifier",B:"To capture combination character beyond what individual terpenes describe",C:"To meet a Health Canada labeling requirement",D:"To replace the Leaning system",correct:"B"},
 ],
 "8":[
  {t:"What should be the first thing a staff member does at the start of their shift?",A:"Check the inventory tab for new arrivals",B:"Tap Switch Staff and select their name",C:"Open the Terpenes tab to refresh memory",D:"Review the previous shift's notes",correct:"B"},
  {t:"A product card shows a terpene trio. The order of the three terpenes reflects:",A:"The dominance order from highest to lowest",B:"The order they appear on BCLDB — alphabetical",C:"The customer's most-requested order",D:"The platform's recommendation priority",correct:"B"},
  {t:"When should you use the override system?",A:"Only when correcting THC percentages",B:"When you have better information than BCLDB shows",C:"To temporarily personalize the app to your taste",D:"Only when a manager requests it",correct:"B"},
  {t:"A customer asks for sleep support. The best filter strategy is:",A:"Filter by SPECIES = Indica only",B:"Filter to Indica Leaning and sort by Lowest Somatic",C:"Filter to highest THC products only",D:"Filter to lowest CBD products",correct:"B"},
  {t:"A customer's package shows that the dominant terpene differs from what the platform assumes. The right action is:",A:"Trust the platform and ignore the package",B:"Tell the customer the package is wrong",C:"Override the product with the known percentages",D:"Refer the customer to a different product",correct:"C"},
 ],
 "9":[
  {t:"The most important discovery question to ask a customer is:",A:"\"How much do you want to spend?\"",B:"\"What kind of experience are you looking for?\"",C:"\"Are you an Indica or Sativa person?\"",D:"\"What's your favorite brand?\"",correct:"B"},
  {t:"When recommending a product, what's the right order of information?",A:"THC percentage → terpenes → Leaning",B:"Leaning → character → plant-kingdom reference → use case",C:"Brand → strain name → reviews",D:"SPECIES → THC → CBD",correct:"B"},
  {t:"A customer insists they only buy Indicas. The best response is to:",A:"Tell them the Indica label is meaningless",B:"Refuse to help unless they accept the chemistry framework",C:"Find a high-myrcene product that matches their expectation",D:"Recommend a Sativa to challenge their belief",correct:"C"},
  {t:"Without package percentages, how should you describe a product whose trio is caryophyllene, linalool, and myrcene?",A:"\"This is myrcene-dominant, classic evening sedation\"",B:"\"This has caryophyllene, linalool, and myrcene in the trio — an aligned evening profile\"",C:"\"This is the strongest Indica we carry\"",D:"\"This product is identical to every other Indica\"",correct:"B"},
  {t:"A customer asks a question you don't know the answer to. The best response is:",A:"Make your best guess to keep the conversation moving",B:"Change the subject to a topic you do know",C:"Say \"let me check\" and look it up together",D:"Refer them to a different staff member quietly",correct:"C"},
 ],
 "10":[
  {t:"Which of these statements is a therapeutic claim that violates Canadian rules?",A:"\"Many customers find this helpful for sleep\"",B:"\"This chemistry tends to be relaxing\"",C:"\"This product treats your insomnia\"",D:"\"Some research suggests anti-inflammatory properties\"",correct:"C"},
  {t:"A customer's ID looks suspicious. What's the right action?",A:"Ask their friend to vouch for them",B:"Politely decline the sale",C:"Sell anyway if they seem old enough",D:"Ask increasingly difficult ID questions",correct:"B"},
  {t:"A customer asks if they can drive after consuming. The most appropriate response is:",A:"\"You'll be safe to drive within an hour\"",B:"\"Low-THC products won't affect driving\"",C:"\"The safest approach is to plan not to drive at all\"",D:"\"Edibles wear off by morning\"",correct:"C"},
  {t:"When a customer asks about cannabis for a specific medical condition, the Sommelier should:",A:"Recommend a specific product as a treatment",B:"Refuse to discuss anything medical",C:"Talk about chemistry and refer them to their doctor",D:"Suggest they stop their prescribed medications",correct:"C"},
  {t:"Which principle is part of the Sommelier Code of Ethics?",A:"Always recommend the highest-margin product",B:"Defend the framework even when customers disagree",C:"Honesty over sales, customer experience over framework loyalty",D:"Treat the platform as more reliable than customer feedback",correct:"C"},
 ],
 "11":[
  {t:"Watts et al. (2021) found Indica- and Sativa-labelled samples genetically indistinct, yet the labels loosely tracked a few terpenes such as myrcene. The correct Sommelier takeaway is:",A:"The labels are meaningless noise and should never once be mentioned to any customer at all.",B:"The labels mark chemistry loosely; they don't cause effect, so read the chemistry.",C:"Sativa genetics do reliably produce energizing daytime effects, so the label can be trusted after all.",D:"Myrcene content is irrelevant to a product because genetics were shown not to predict its effect.",correct:"B"},
  {t:"A product labelled SATIVA has the trio Caryophyllene, Myrcene, Pinene, and the package shows Myrcene clearly dominant. A customer wants strong daytime energy. The best move is:",A:"Recommend it with full confidence, because the SATIVA label on the box guarantees daytime energy.",B:"Recommend it anyway, but tell the customer to take a noticeably larger dose to force the energy out.",C:"Steer away; myrcene dominance leans it relaxed, so offer a pinene-forward option.",D:"Refuse to sell the product entirely, on the grounds that the producer's label is simply inaccurate.",correct:"C"},
  {t:"A customer says a high-CBD product made the THC feel 'less intense than usual.' The best explanation from what you learned is:",A:"CBD physically blocks THC molecules from ever entering the bloodstream or the body at all.",B:"CBD tends to dampen effect magnitude, pulling the experience toward neutral.",C:"CBD actually raises THC potency, so the customer here is almost certainly misremembering the night.",D:"CBD chemically converts the THC in the product into a purely sedative, non-psychoactive compound.",correct:"B"},
  {t:"Why is caryophyllene uniquely useful for a customer managing inflammation-related pain?",A:"It is by far the most psychoactive terpene, so it simply overwhelms and drowns out the pain signals.",B:"It blocks the CB1 receptors throughout the brain, which is what prevents any high from developing.",C:"OptioIt binds CB2 receptors, which cluster in immune and peripheral tissue tied to inflammation.n C",D:"It is rapidly converted into CBD the moment it is inhaled, and the CBD is what relieves the pain.",correct:"C"},
  {t:"BCLDB lists a product's top three terpenes alphabetically. What specific error can this cause if a Sommelier skips Stage 2?",A:"Assuming the first-listed terpene leads, when alphabetical order ignores concentration.",B:"It causes the customer to be quoted an incorrect shelf price for the product at the point of sale.",C:"It hides the product's THC percentage from the card until the second reading stage is completed.",D:"It causes the product to be wrongly sorted and miscategorised as an edible instead of as flower.",correct:"A"},
  {t:"A customer is 'wired but tired' - anxious, mind racing, can't sleep and finds pure myrcene products too heavy. The best-fit chemistry is:",A:"Terpinolene-dominant, chosen specifically for its strong and reliable upward cerebral activation push.",B:"Pinene-dominant, chosen to give the customer as much sharp mental clarity and alertness as possible.",C:"Limonene-dominant, chosen mainly for its bright, uplifting, mood-elevating citrus-driven character.",D:"Linalool-forward - calming and anti-anxiety without heavy body sedation.",correct:"D"},
  {t:"Which terpene-to-effect pairing is INCORRECT?",A:"Pinene - strong body sedation and couch-lock.",B:"Myrcene - body sedation, heaviness, and a general couch-friendly relaxed feeling.",C:"Limonene - uplifting, mood-elevating, bright, and generally energizing in character.",D:"Linalool - calming, soothing, and reliably anti-anxiety, much like lavender is.",correct:"A"},
  {t:"A product's trio is Humulene, Myrcene, Caryophyllene, and all three pull the same direction. Before entering percentages, the most confident read is:",A:"Sativa Leaning, because the trio reads as bright, activating, and energizing all the way through.",B:"Indica Leaning - grounding and sedating across the whole trio.",C:"Hybrid Leaning, because the three terpenes together produce a genuinely balanced, centred product.",D:"No read is possible at all here, because exact package percentages have not yet been entered for it.",correct:"B"},
  {t:"A customer prone to anxiety wants daytime energy, and a candidate product is Terpinolene-dominant. The best judgment is:",A:"Be cautious - terpinolene can trigger racing; offer a limonene-forward option instead.",B:"Recommend it without reservation, since terpinolene is simply the best daytime terpene for everyone.",C:"Recommend it but tell the customer to take a larger dose so they feel the full daytime effect.",D:"Recommend an INDICA-labelled product to them instead, on the basis that all Sativas cause anxiety.",correct:"A"},
  {t:"Why is a Stage 1 Terpene Effect Analyzer score less trustworthy for a Limonene/Myrcene/Pinene trio than for a Caryophyllene/Linalool/Myrcene trio?",A:"Because the first trio simply contains a larger total number of distinct terpenes than the second does.",B:"Because limonene is not actually present anywhere in the platform's underlying terpene database at all.",C:"It pulls in opposite directions, so which terpene leads swings the whole result.",D:"Because any mixed-direction trio always scores exactly neutral and therefore cannot be read reliably.",correct:"C"},
  {t:"A customer's COA shows a terpene at high concentration that isn't in the product's BCLDB trio at all. The right action is:",A:"Ignore the COA completely, on the principle that the BCLDB catalogue data is always authoritative.",B:"Tell the customer that the COA they brought in is very probably a fake or a mislabelled document.",C:"Refuse to recommend the product at all, since its published data and its COA plainly disagree here.",D:"Override to match the COA - BCLDB reports only the top three, and this batch differs.",correct:"D"},
  {t:"Two products list identical terpene trios, yet after Stage 2 the platform shows one as Indica Leaning and the other as Hybrid Leaning. The most likely reason is:",A:"It is simply a bug in the platform's scoring engine that occasionally produces inconsistent labels.",B:"One of the two products has almost certainly been mislabelled as cannabis when it is something else.",C:"Different dominant percentages shift the weighting, changing Overall and the Leaning.",D:"Their SPECIES labels must differ, and the SPECIES label is what fully determines a product's Leaning.",correct:"C"},
  {t:"A product scores Cerebral +4 and Somatic -4. What Leaning does it receive, and what must you remember?",A:"Sativa Leaning, because the strongly positive Cerebral score is the one that wins out in the end.",B:"Indica Leaning, because the strongly negative Somatic score is the one that wins out in the end.",C:"No Leaning is assigned at all, because the two opposing axis scores simply cancel each other out.",D:"Hybrid Leaning - Overall is near zero, but it's high-contrast, so read the axes.",correct:"D"},
  {t:"Taking an already-sedating terpene profile and raising the THC from 14% to 28% will most likely:",A:"Flip the product over into a Sativa Leaning, energizing product despite its sedating terpene profile.",B:"Have no measurable effect on the scores at all, since the terpene profile alone sets the whole rating.",C:"Deepen the sedation - THC amplifies whichever direction the profile points.",D:"Pull both the Cerebral and Somatic axes back toward zero and flatten the product into a neutral read.",correct:"C"},
  {t:"What is the purpose of Terpene Effect Analyzer's 60/40 dampening blend?",A:"It weights the THC contribution at 60% of the score and the CBD contribution at the remaining 40%.",B:"It blends 60% chemistry with 40% baseline so no single terpene runs off-scale.",C:"It splits the final score itself into a 60% Cerebral component and a 40% Somatic component instead.",D:"It exists to make sure that roughly 60% of the products across the whole catalog land as Hybrid.",correct:"B"},
  {t:"A product is labelled INDICA but its measured terpene profile is genuinely activating. How does the SPECIES nudge affect the result?",A:"It forces the product to score as an Indica Leaning regardless of what its actual chemistry says.",B:"A small downward nudge applies, but the activating chemistry still drives the score.",C:"It cancels out and discards the measured terpene data entirely in favour of the SPECIES label.",D:"It doubles the product's Cerebral score outright to reflect the strength of the INDICA label.",correct:"B"},
  {t:"A product combines Caryophyllene, Myrcene, and Limonene at similar levels - grounding, sedating, and uplifting at once. The most likely read is:",A:"Hybrid Leaning and versatile - the opposing pulls partly cancel each other.",B:"Strongly Sativa Leaning and energizing, because the uplifting limonene clearly dominates the blend.",C:"Strongly Indica Leaning and deeply sedating, because the sedating myrcene clearly dominates the blend.",D:"No Leaning at all, because three different terpenes together cannot meaningfully be scored as a unit.",correct:"A"},
  {t:"A customer notices whole-flower cannabis feels different from an equal dose of isolated THC. The best explanation is:",A:"Isolated THC is always simply stronger than flower, so the customer very likely imagined the difference.",B:"Whole flower actually contains no real THC at all, which is exactly why the two feel so different.",C:"The whole difference comes down purely to the method of consumption rather than to the chemistry itself.",D:"The plant's terpenes and minor cannabinoids modulate it - the entourage effect.",correct:"D"},
  {t:"A customer wants daytime focus but is anxiety-prone. The best platform strategy is:",A:"Filter to Sativa Leaning and then simply pick whichever of the results has the highest THC percentage.",B:"Filter to Sativa Leaning, favour Pinene in the trio, and avoid Terpinolene-dominant.",C:"Filter the catalogue by SPECIES equals Sativa only, and then stop the search right there without more.",D:"Filter to Indica Leaning instead, on the theory that a calmer product will keep the customer relaxed.",correct:"B"},
  {t:"A staff member forgets to select their name in Switch Staff, then completes a module quiz. The consequence is:",A:"Their quiz result records under the previously selected staff member, so their own certification progress isn't updated.",B:"The quiz is automatically discarded the moment they try to submit it.",C:"The whole app locks itself until a manager comes over and signs back in.",D:"Nothing is affected, because quiz results are never tied to a staff member.",correct:"A"},
  {t:"When you override a product's terpene data with confirmed package percentages, what happens?",A:"Only the product's cover card image changes, and none of the underlying scores are affected at all.",B:"The product is immediately and permanently deleted from the store's catalogue once you confirm it.",C:"Nothing at all changes on the product until a manager separately reviews and approves your edit.",D:"Terpene Effect Analyzer recalculates, the Leaning may shift, and the change applies store‑wide until the daily reset.",correct:"D"},
  {t:"Which recommendation best follows the Sommelier translation pattern?",A:"\"This one is 24% THC, the trio is caryophyllene-linalool-myrcene, and it reads Cerebral -3 and Somatic -4 on the two axes.\"",B:"\"It's a Sativa, and Sativas are simply the ones that happen to be meant for the daytime, so that is really the one that you want here.\"",C:"\"Honestly I would just say go ahead and pick it up and try it out for yourself and then see how the whole thing happens to go for you.\"",D:"\"It's Indica Leaning - body-relaxing with a calm, quiet head, like lavender. Use it about an hour before bed.\"",correct:"D"},

function param(k){return new URLSearchParams(location.search).get(k)||"";}
function esc(s){return (s||"").replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}
const mod=(param("mod")||"1").trim();
const QUESTIONS=BANKS[mod]||BANKS["1"];
const total=QUESTIONS.length;
function parseAnswers(raw){raw=(raw||"").toUpperCase().trim();let a=raw.includes(",")?raw.split(","):raw.split("");a=a.map(x=>x.trim()).filter(x=>x.length);while(a.length<total)a.push("");return a.slice(0,total);}
const staff=param("n")||"Unknown Staff";
const storeName=param("sn"); const storeNum=param("s");
const dateLabel=param("d")||new Date().toLocaleDateString('en-CA');
const title=(mod==="11")?"Final Exam Report":("Module "+mod+" — Quiz Report");
const answers=parseAnswers(param("a"));
let correct=0; answers.forEach((x,i)=>{if(x===QUESTIONS[i].correct)correct++;});
const passRaw=(param("p")||"").trim();
const isPass=passRaw?/^(pass|passed|true|yes|p)$/i.test(passRaw):(correct/total>=0.8);
const passWord=isPass?"Pass":"Fail";
document.getElementById("title").textContent=title;
document.title=title+" — "+staff;
const storeLine=(storeName?esc(storeName):"Store")+(storeNum?"  (#"+esc(storeNum)+")":"");
document.getElementById("summary").innerHTML=
 `<div class="who"><div class="name">${esc(staff)}</div><div class="meta">${storeLine} &nbsp;|&nbsp; ${esc(dateLabel)}</div></div>
  <div class="score ${isPass?'pass':'fail'}"><div class="n">${correct}/${total}</div><div class="r">${passWord}</div></div>`;
const opt=(q,l)=>q[l];
document.getElementById("questions").innerHTML=QUESTIONS.map((q,i)=>{
 const given=answers[i],ok=given===q.correct;
 const gt=given?esc(opt(q,given)||""):"(no answer)";
 let h=`<div class="q"><div class="text">Q${i+1}. ${esc(q.t)}</div>
   <div class="ans ${ok?'ok':'no'}"><span class="tag">[${ok?'Correct':'Wrong'}]</span><span>Your answer: ${given||'—'}. ${gt}</span></div>`;
 if(!ok) h+=`<div class="correct">Correct answer: ${q.correct}. ${esc(opt(q,q.correct)||"")}</div>`;
 return h+`</div>`;
}).join("");
document.getElementById("gen").textContent="Generated "+new Date().toLocaleDateString('en-CA');
</script>
