<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Selling It Right — Report</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --dark:#212529; --grey:#6e747a; --line:#e1e4e6; --card:#f7f9fa;
    --green:#167a3c; --red:#c4302b; --teal:#4aabbf;
  }
  *{box-sizing:border-box; -webkit-print-color-adjust:exact; print-color-adjust:exact;}
  html,body{margin:0; padding:0; background:#eceff1;
    font-family:'DM Sans',system-ui,-apple-system,Segoe UI,Roboto,sans-serif; color:var(--dark);}
  .sheet{max-width:820px; margin:24px auto; background:#fff; min-height:1000px;
    box-shadow:0 2px 18px rgba(0,0,0,.12);}
  /* header */
  .head{background:var(--dark); color:#fff; padding:22px 34px;}
  .head h1{margin:0; font-size:22px; font-weight:700; letter-spacing:.2px;}
  .head p{margin:3px 0 0; font-size:12px; color:#c7d0d4; font-weight:500;}
  /* summary card */
  .body{padding:26px 34px 40px;}
  .summary{display:flex; justify-content:space-between; align-items:flex-start;
    background:var(--card); border:1px solid var(--line); border-radius:10px;
    padding:16px 20px; margin-bottom:22px;}
  .who .name{font-size:17px; font-weight:700;}
  .who .meta{font-size:13px; color:var(--grey); margin-top:3px; font-weight:500;}
  .score{text-align:right; line-height:1;}
  .score .n{font-size:34px; font-weight:700;}
  .score .r{font-size:13px; font-weight:700; letter-spacing:1px; margin-top:4px;}
  .pass .n,.pass .r{color:var(--green);} .fail .n,.fail .r{color:var(--red);}
  /* questions */
  .q{margin-bottom:16px; padding-bottom:14px; border-bottom:1px solid var(--line);}
  .q:last-child{border-bottom:none;}
  .q .text{font-size:14px; font-weight:700; line-height:1.35;}
  .ans{font-size:13px; line-height:1.4; margin-top:6px; display:flex; gap:7px;}
  .tag{font-weight:700; white-space:nowrap;}
  .ans.ok{color:var(--green);} .ans.no{color:var(--red);}
  .correct{color:var(--green); font-size:13px; line-height:1.4; margin-top:3px;}
  .foot{padding:14px 34px 26px; color:var(--grey); font-size:11px;
    display:flex; justify-content:space-between; border-top:1px solid var(--line);}
  .printbar{max-width:820px; margin:12px auto 0; text-align:right;}
  .printbar button{font-family:inherit; font-size:13px; font-weight:600; cursor:pointer;
    background:var(--teal); color:#fff; border:none; border-radius:8px; padding:9px 16px;}
  @media print{
    body{background:#fff;}
    .sheet{box-shadow:none; margin:0; max-width:none; min-height:auto;}
    .printbar{display:none;}
    @page{margin:12mm;}
  }
</style>
</head>
<body>
<div class="printbar"><button onclick="window.print()">Print / Save as PDF</button></div>
<div class="sheet">
  <div class="head">
    <h1>Selling It Right — Monthly Compliance Report</h1>
    <p>The Terpene Sommelier · Staff Certification</p>
  </div>
  <div class="body">
    <div class="summary" id="summary"></div>
    <div id="questions"></div>
  </div>
  <div class="foot">
    <span id="gen"></span>
    <span>The Terpene Sommelier</span>
  </div>
</div>

<script>
// ---- fixed SIR question bank (update here if the quiz changes) ----
const QUESTIONS = [
 {t:"According to Canada's Lower-Risk Cannabis Use Guidelines, why is it recommended to delay cannabis use until age 25 or later?",
  A:"Cannabis is more addictive for younger users",B:"Users under 25 are more likely to experience allergic reactions",
  C:"Federal law prohibits cannabis sales to anyone under 25",D:"The human brain is not fully developed until around age 25, making younger users more vulnerable to harm",correct:"D"},
 {t:"How many pieces of ID are required to verify a patron's age in BC?",
  A:"Two pieces of ID",B:"One piece of government-issued photo ID",C:"One piece of any ID with a birth date",D:"No ID is required if the patron appears over 30",correct:"A"},
 {t:"What is the maximum amount of dried cannabis (or equivalent) that can be sold to a patron in a single transaction?",
  A:"15 grams",B:"28 grams",C:"50 grams",D:"30 grams",correct:"D"},
 {t:"A patron enters your store showing signs of intoxication. What are you legally required to do?",
  A:"Allow them to browse but refuse the sale at the counter",B:"Ask them to leave the store",C:"Sell them a low-THC product only",D:"Call the police immediately",correct:"B"},
 {t:"Which of the following is NOT an acceptable form of primary ID in BC?",
  A:"Canadian passport",B:"Certificate of Indian Status",C:"Credit card",D:"BC driver's licence",correct:"C"},
 {t:"All cannabis products sold in a licensed retail store must be purchased through which organization?",
  A:"Health Canada",B:"The federal Cannabis Council",C:"The LCRB",D:"The Liquor Distribution Branch (LDB)",correct:"D"},
 {t:"How long must cannabis purchase and sales records be kept?",
  A:"6 years",B:"3 years",C:"10 years",D:"1 year",correct:"A"},
 {t:"A patron who has been asked to leave a cannabis store must not return for at least how long?",
  A:"48 hours",B:"12 hours",C:"24 hours",D:"1 hour",correct:"C"},
 {t:"Which of the following is true about cannabis samples in a retail store?",
  A:"Staff may provide small samples of dried flower to patrons",B:"Samples are permitted for medical cannabis patients only",
  C:"Patrons may sample from smell jars under staff supervision",D:"Samples are not permitted — cannabis must be sold in original, unopened packaging",correct:"D"},
 {t:"Cannabis store security camera footage must be stored for a minimum of how many days?",
  A:"14 days",B:"30 days",C:"90 days",D:"7 days",correct:"B"},
];
const PASS_THRESHOLD = 8;

function param(k){ return new URLSearchParams(location.search).get(k) || ""; }
function esc(s){ return (s||"").replace(/[&<>]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }

// answers: accept "D,A,D,..." or "DADBCDACDB"
function parseAnswers(raw){
  raw=(raw||"").toUpperCase().trim();
  let arr = raw.includes(",") ? raw.split(",") : raw.split("");
  arr = arr.map(x=>x.trim()).filter(x=>x.length);
  while(arr.length<QUESTIONS.length) arr.push("");
  return arr.slice(0,QUESTIONS.length);
}

const MONTHS=["January","February","March","April","May","June","July",
  "August","September","October","November","December"];
// accepts "August 2026" as-is, or "2026-7" / "2026-07" -> "July 2026"
function fmtMonth(m){
  if(!m) return new Date().toLocaleString('en-CA',{month:'long',year:'numeric'});
  const mk = m.match(/^(\d{4})-(\d{1,2})/);
  if(mk){ const mo=parseInt(mk[2],10); if(mo>=1&&mo<=12) return MONTHS[mo-1]+" "+mk[1]; }
  return m;
}
const staff = param("n") || "Unknown Staff";
const storeName = param("sn");
const storeNum = param("s");
const monthLabel = fmtMonth(param("m"));
const answers = parseAnswers(param("a"));

let correct=0;
answers.forEach((a,i)=>{ if(a===QUESTIONS[i].correct) correct++; });
const passLabel = (param("p") || (correct>=PASS_THRESHOLD?"Pass":"Fail"));
const isPass = passLabel.toLowerCase()==="pass";

// summary
const storeLine = (storeName? esc(storeName):"Store") + (storeNum? "  (#"+esc(storeNum)+")":"");
document.getElementById("summary").innerHTML =
  `<div class="who"><div class="name">${esc(staff)}</div>
     <div class="meta">${storeLine} &nbsp;|&nbsp; ${esc(monthLabel)}</div></div>
   <div class="score ${isPass?'pass':'fail'}"><div class="n">${correct}/10</div>
     <div class="r">${esc(passLabel.toUpperCase())}</div></div>`;

// questions
const opt = (q,l)=>q[l];
document.getElementById("questions").innerHTML = QUESTIONS.map((q,i)=>{
  const given=answers[i], ok=given===q.correct;
  const givenTxt = given? esc(opt(q,given)||"") : "(no answer)";
  let html = `<div class="q"><div class="text">Q${i+1}. ${esc(q.t)}</div>
    <div class="ans ${ok?'ok':'no'}"><span class="tag">[${ok?'Correct':'Wrong'}]</span>
      <span>Your answer: ${given||'—'}. ${givenTxt}</span></div>`;
  if(!ok){
    html += `<div class="correct">Correct answer: ${q.correct}. ${esc(opt(q,q.correct)||"")}</div>`;
  }
  return html+`</div>`;
}).join("");

document.getElementById("gen").textContent =
  "Generated " + new Date().toLocaleDateString('en-CA');
document.title = `SIR Report — ${staff} — ${monthLabel}`;
</script>
</body>
</html>
