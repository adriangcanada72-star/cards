<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Terpene Sommelier</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#f5f7f6;--panel:#ffffff;--line:#e2e8e4;--txt:#14201a;--muted:#66756c;--green:#2f7d4f;--red:#c14848;--cer:#2b93cf;--som:#e07a1c;--gold:#c99a2f;}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--txt);font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;line-height:1.45}
.wrap{max-width:1000px;margin:0 auto;padding:18px}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px;border-bottom:1px solid var(--line);padding-bottom:12px}
.topbar img.logo{height:60px}
nav{display:flex;gap:6px}nav a{cursor:pointer;font-weight:700;color:var(--muted);padding:8px 14px;border-radius:8px;font-size:15px}
nav a.active{color:var(--green);background:#eaf5ee}
input,select{background:#fff;border:1px solid var(--line);color:var(--txt);border-radius:8px;padding:9px 11px;font-size:14px}
.controls{display:flex;gap:10px;margin-bottom:12px;flex-wrap:wrap}#q{flex:1;min-width:200px}
.focus{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.fcol{border-radius:14px;padding:14px 16px;border:1px solid var(--line)}
.fcol.fav{background:linear-gradient(180deg,#f2fbf5,#eaf7ef);border-color:#cfe9d8}
.fcol.avoid{background:linear-gradient(180deg,#fef4f4,#fdecec);border-color:#f2cccc}
.fhead{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.ficon{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:none}
.ficon.fav{background:#d7f0e0}.ficon.avoid{background:#f8d7d7}.ficon svg{width:20px;height:20px}
.fhead .t{font-weight:800;font-size:14px}.fhead .s{font-size:11px;color:var(--muted)}
.chips{min-height:26px;margin-bottom:8px;display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 8px 3px 3px;border-radius:999px;font-size:12px;font-weight:600;background:#fff}
.chip img{width:22px;height:22px;border-radius:50%;object-fit:cover}
.chip.fav{color:#1c6b3d;border:1px solid #bfe3cd}.chip.avoid{color:#a83a3a;border:1px solid #f0c3c3}
.chip b{cursor:pointer;opacity:.6;padding-left:2px}.chip b:hover{opacity:1}
.fcol select{width:100%;background:rgba(255,255,255,.75)}
.ftoggle{display:inline-flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);border-radius:8px;padding:9px 13px;font-size:14px;font-weight:600;cursor:pointer;margin-bottom:10px}
.ftoggle .badge{background:var(--green);color:#fff;border-radius:999px;font-size:11px;padding:1px 7px}
.filters{display:grid;grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:8px;margin-bottom:12px}
.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.pcard{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;cursor:pointer;transition:box-shadow .15s,border-color .15s;display:flex;flex-direction:column;gap:10px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.pcard:hover{border-color:var(--green);box-shadow:0 4px 14px rgba(0,0,0,.08)}
.pcard .lg{width:100%;height:150px;background:#fff;border:1px solid var(--line);border-radius:10px;display:flex;align-items:center;justify-content:center;overflow:hidden}
.pcard .lg img{max-width:92%;max-height:92%;object-fit:contain}
.pname{font-weight:700;font-size:15px;margin-bottom:2px}.pmeta{color:var(--muted);font-size:12px}
.src{display:inline-block;font-size:10px;padding:2px 8px;border-radius:999px;border:1px solid var(--line);margin-top:4px}
.src.dd{color:#1f6f9e;border-color:#bcd9e8;background:#eef6fb}.src.bc{color:#2f7d4f;border-color:#c3e2ce;background:#eef7f1}.muted{color:var(--muted)}
#ov,#ovt{position:fixed;inset:0;background:rgba(20,30,25,.45);display:none;align-items:flex-start;justify-content:center;padding:24px;overflow:auto}
#ov.on,#ovt.on{display:flex}#ovt{z-index:50}
.sheet{background:var(--panel);border:1px solid var(--line);border-radius:16px;max-width:680px;width:100%;padding:22px;position:relative;box-shadow:0 10px 40px rgba(0,0,0,.2)}
.close{position:absolute;top:14px;right:16px;cursor:pointer;color:var(--txt);font-size:22px;background:#fff;border:1px solid var(--line);border-radius:8px;width:40px;height:40px}
.phead{display:flex;flex-direction:column;align-items:center;gap:12px;margin:4px 0 6px}
.logobox{width:100%;background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;align-items:center;justify-content:center;min-height:180px}
.logobox img{max-width:100%;max-height:240px;object-fit:contain}
.ptitle{text-align:center}.phead h2{margin:0;font-size:24px}
.shortdesc{color:#33433a;font-size:14px;margin:8px 0 4px}
.tcard{display:flex;gap:12px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:8px 12px;margin-bottom:8px;background:#fafcfb}
.tcard.clickable{cursor:pointer}.tcard.clickable:hover{border-color:var(--green);background:#f2faf5}
.tcard img{width:44px;height:44px;object-fit:cover;border-radius:8px}.tph{width:44px;height:44px;border-radius:8px;background:#e8efe9}
.tname{font-weight:700;font-size:14px}.tsc{color:var(--muted);font-size:12px}.chev{margin-left:auto;color:var(--muted);font-size:22px}
.inrow{display:grid;grid-template-columns:52px 1fr 92px;gap:8px;align-items:center;margin-bottom:7px}.inrow .pos{color:var(--muted);font-size:12px}
.chem{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin:10px 0}.chem label{display:block;font-size:12px;color:var(--muted);margin-bottom:3px}.chem input{width:100%}
.hint{font-size:11px;color:var(--muted);margin:2px 0 0}
.sect{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);margin:16px 0 8px;border-top:1px solid var(--line);padding-top:12px}
.meter{margin:11px 0}.meter .head{display:flex;justify-content:space-between;margin-bottom:5px}.meter .name{font-weight:600;font-size:14px}
.scale{display:grid;grid-template-columns:repeat(11,1fr);gap:3px}
.seg{height:22px;border-radius:4px;background:#eef2f0;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:10px;color:#93a29a}
.seg.on-cer{background:var(--cer);color:#fff;font-weight:700;border-color:var(--cer)}.seg.on-som{background:var(--som);color:#fff;font-weight:700;border-color:var(--som)}.seg.on-ov{background:var(--gold);color:#221900;font-weight:700;border-color:var(--gold)}
.badge{display:inline-block;background:#eaf5ee;border:1px solid var(--green);color:#1f6b3f;padding:5px 12px;border-radius:999px;font-weight:700;font-size:14px;margin:6px 0}
.strength{color:var(--muted);font-size:13px;margin-top:10px}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:10px 18px;font-size:13px;margin-top:6px}.kv .k{color:var(--muted);font-size:11px}.kv .v{font-weight:600}.kv .full{grid-column:1 / -1}
.tdhead{display:flex;gap:16px;align-items:center;margin-bottom:8px}.tdhead img{width:110px;height:110px;object-fit:cover;border-radius:14px}.tdhead h2{margin:0;font-size:24px}
.tdetails{font-size:13px;color:#2c3a32;line-height:1.65}
.warn{background:#fbf1e2;border:1px solid #e5c99a;color:#7a5a24;padding:10px 12px;border-radius:8px;font-size:13px;margin-bottom:12px;display:none}
@media(max-width:560px){.focus{grid-template-columns:1fr}}
</style></head><body><div class="wrap">

// ================== TRIAX V3 ENGINE (ported from workbook) ==================
const _DBMAP = {}; TERPENE_DB.forEach(t => _DBMAP[t.name] = t);
const CEREBRAL_LABELS = ["deeply suppressed","dulled","mildly clouded","soft","quiet","clear","gently lifted","alert","stimulating","sharp","electric"];
const SOMATIC_LABELS  = ["narcotic, immobilizing","heavy, sedating","deeply relaxed","relaxed","grounded","neutral","subtle body lift","light, mobile","energizing","very energizing","activating"];
const OVERALL_LABELS  = ["Narcotic Gravity (Very Sedating)","Tranquilizing","Sedative","Heavy Hybrid","Grounded / Calm","Balanced","Bright / Light Uplift","Upbeat Hybrid","Functional Stimulating","High Velocity","Electric Cerebral (Very Energizing)"];

function _xround(x){ return Math.sign(x) * Math.round(Math.abs(x) + 1e-9); } // Excel ROUND: half away from zero
function _clamp(x,lo,hi){ return Math.max(lo, Math.min(hi, x)); }
function _strip(n){ if(!n) return ""; if(n.slice(0,5)==="Beta-") return n.slice(5); if(n.slice(0,6)==="Alpha-") return n.slice(6); return n; }
function _look(name){ return _DBMAP[name] || {cerebral:0,somatic:0,threshold:0,volatility:0,density:0,clarity:0,aroma:""}; }
function _num(v){ v=parseFloat(v); return isNaN(v)?0:v; }
function _fix1(v){ return v.toFixed(1); }

function computeTriax(input){
  const t1=input.t1||"", t2=input.t2||"", t3=input.t3||"";
  const p1=_num(input.p1), p2=_num(input.p2), p3=_num(input.p3);
  const thc=_num(input.thc), cbd=_num(input.cbd), totalTerp=_num(input.totalTerp);
  const L1=_look(t1), L2=_look(t2), L3=_look(t3);
  const sumP=p1+p2+p3;
  const names=[t1,t2,t3], pcts=[p1,p2,p3], looks=[L1,L2,L3];

  // Step 1 Base Vector (threshold-gated, %-weighted; else equal weights)
  function base(key){
    if(sumP>0){
      return (p1>=L1.threshold?L1[key]:0)*(p1/sumP)
           + (p2>=L2.threshold?L2[key]:0)*(p2/sumP)
           + (p3>=L3.threshold?L3[key]:0)*(p3/sumP);
    }
    return (L1[key]+L2[key]+L3[key])/3;
  }
  const base_cer=base("cerebral"), base_som=base("somatic");

  // Step 2 Synergy (both terpenes of a pair present)
  const inSet = n => (n===t1)||(n===t2)||(n===t3);
  let syn_cer=0, syn_som=0;
  SYNERGIES.forEach(s=>{ if(inSet(s.a)&&inSet(s.b)){ syn_cer+=s.cer; syn_som+=s.som; }});

  // Step 3 Conflict
  const cerVals=[L1.cerebral,L2.cerebral,L3.cerebral], somVals=[L1.somatic,L2.somatic,L3.somatic];
  const conf_cer=(Math.max(...cerVals)>=4 && Math.min(...cerVals)<=-4)?-1:0;
  const conf_som=(Math.max(...somVals)>=4 && Math.min(...somVals)<=-4)?-1:0;

  // Steps 4-6 Volatility/Clarity -> Cerebral ; Density -> Somatic (negative)
  const vol_cer=L1.volatility+L2.volatility+L3.volatility;
  const cla_cer=L1.clarity+L2.clarity+L3.clarity;
  const den_som=-(L1.density+L2.density+L3.density);

  // Step 7 Raw
  const raw_cer=base_cer+syn_cer+conf_cer+vol_cer+cla_cer;
  const raw_som=base_som+syn_som+conf_som+den_som;
  const raw_ov=(Math.abs(raw_cer)+Math.abs(raw_som)===0)?0:
     (Math.abs(raw_cer)*raw_cer+Math.abs(raw_som)*raw_som)/(Math.abs(raw_cer)+Math.abs(raw_som));

  // Modulators
  const loadMult=_clamp(0.5 + totalTerp/1.5*0.5, 0.5, 1.5);
  const thcAmp=_clamp(1 + (thc-20)/20*0.4, 0.6, 1.4);
  const cbdDamp=(thc===0)?1:Math.max(0.6, 1 - Math.min(1, cbd/thc)*0.4);
  const mod=(x)=>x*loadMult*thcAmp*cbdDamp;

  // Step 8 Final
  const cerebral=_clamp(_xround(mod(raw_cer)),-5,5)+0;
  const somatic =_clamp(_xround(mod(raw_som)),-5,5)+0;
  const overall =_clamp(_xround(mod(raw_ov)),-5,5)+0;

  // Profile type (single-axis lean based on Overall score)
  let profile;
  if(overall>=2) profile="Sativa Leaning";
  else if(overall<=-2) profile="Indica Leaning";
  else profile="Hybrid Leaning";

  // Aroma prominence
  function prom(p){ if(p===0) return "—"; const s=p/sumP; return s>=0.45?"DOMINANT":(s>=0.22?"Supporting":"trace"); }
  const aroma=[0,1,2].map(i=>({terpene:names[i], prominence:sumP>0?prom(pcts[i]):(pcts[i]===0?"—":"trace"), notes:looks[i].aroma}));

  // Sommelier blend (sorted, prefix-stripped)
  const sorted=[_strip(t1),_strip(t2),_strip(t3)].sort((a,b)=>a.localeCompare(b));
  const key=sorted.join("|");
  let blend=BLENDS[key];
  if(blend===undefined){
    const a1=_look(sorted[0]).aroma, a2=_look(sorted[1]).aroma, a3=_look(sorted[2]).aroma;
    const cap = a1 ? (a1.charAt(0).toUpperCase()+a1.slice(1)) : "";
    let s = cap + ", combined with " + a2;
    if(sorted[2] && sorted[2]!=="(none)" && a3) s += ", and " + a3;
    blend = s + ".";
  }

  // Strength read
  let sr="";
  if(totalTerp>=2.5) sr+="Terpene-rich at "+_fix1(totalTerp)+"% total — expect a vivid, pronounced experience. ";
  else if(totalTerp>=1.5) sr+="Moderate terpene load at "+_fix1(totalTerp)+"% total — typical BC flower expression. ";
  else if(totalTerp>0) sr+="Light terpene load at "+_fix1(totalTerp)+"% total — subtle expression. ";
  if(thc>=28) sr+="THC is high at "+_fix1(thc)+"% — effects will lean toward both axis extremes. ";
  else if(thc>=18) sr+="THC at "+_fix1(thc)+"% is typical — predicted effects track the ratings directly. ";
  else if(thc>0) sr+="THC at "+_fix1(thc)+"% is mild — predicted effects may feel gentler than the ratings suggest. ";
  if(thc>0){ const r=cbd/thc;
    if(r>=1) sr+="CBD-dominant chemistry ("+_fix1(cbd)+"% CBD) — expect strongly buffered, mild experience.";
    else if(r>=0.3) sr+="Significant CBD content ("+_fix1(cbd)+"%) — softens both extremes.";
    else if(r>=0.05) sr+="Modest CBD ("+_fix1(cbd)+"%) — slight modulation.";
    else sr+="Trace CBD — negligible modulation.";
  }

  return {
    cerebral, somatic, overall,

function cannab(minv,maxv,uom){const conv=v=>{if(v===null||v===undefined||v==="")return null;v=parseFloat(v);if(!isFinite(v))return null;const u=(uom||"").toLowerCase();if(u.includes("mg/g"))return{n:v/10,u:"%"};if(u==="mg")return{n:v,u:" mg"};return{n:v,u:"%"};};const a=conv(minv),b=conv(maxv);if(!a&&!b)return"—";const u=(b||a).u,f=x=>Number.isInteger(x.n)?x.n:(+x.n.toFixed(1));return(a&&b)?`${f(a)}–${f(b)}${u}`:`${f(a||b)}${u}`;}
function cannabMid(minv,maxv,uom){const c=v=>{if(v===null||v===undefined||v==="")return null;v=parseFloat(v);if(!isFinite(v))return null;const u=(uom||"").toLowerCase();if(u.includes("mg/g"))return v/10;if(u==="mg")return null;return v;};const a=c(minv),b=c(maxv);if(a!=null&&b!=null)return+(((a+b)/2).toFixed(1));return a!=null?a:b;}

function recompute(){
