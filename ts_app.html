<style>
:root{--bg:#0f1412;--panel:#18201d;--line:#2a3833;--txt:#e8efe9;--muted:#8fa79c;--green:#5AA06E;--cer:#74C6EA;--som:#F58A34;--gold:#d9b45b;}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--txt);font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;line-height:1.45}

.controls{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap}
input,select{background:#0f1512;border:1px solid var(--line);color:var(--txt);border-radius:8px;padding:9px 11px;font-size:14px}
#q{flex:1;min-width:200px}
.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.pcard{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px;cursor:pointer;transition:border-color .15s;display:flex;gap:10px;align-items:flex-start}
.pcard:hover{border-color:var(--green)}.pcard img{width:34px;height:34px;object-fit:contain;border-radius:6px;background:#fff}
.pname{font-weight:700;font-size:14px;margin-bottom:2px}.pmeta{color:var(--muted);font-size:12px}
.src{display:inline-block;font-size:10px;padding:2px 7px;border-radius:999px;border:1px solid var(--line);margin-top:6px}
.src.dd{color:#a6d0e8;border-color:#33566b}.src.bc{color:#a6e0b8;border-color:#33663f}.muted{color:var(--muted)}
#ov{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:flex-start;justify-content:center;padding:24px;overflow:auto}#ov.on{display:flex}
.sheet{background:var(--panel);border:1px solid var(--line);border-radius:14px;max-width:680px;width:100%;padding:20px}
.close{float:right;cursor:pointer;color:var(--muted);font-size:20px;border:none;background:none}
.phead{display:flex;gap:14px;align-items:center;margin-bottom:6px}
.phead img{width:64px;height:64px;object-fit:contain;background:#fff;border-radius:10px;padding:4px}
.phead h2{margin:0;font-size:22px}
.shortdesc{color:#cfe0d6;font-size:14px;margin:8px 0 4px}
.tcard{display:flex;gap:12px;align-items:center;background:#12191600;border:1px solid var(--line);border-radius:10px;padding:8px 12px;margin-bottom:8px}
.tcard img{width:40px;height:40px;object-fit:cover;border-radius:8px}
.tph{width:40px;height:40px;border-radius:8px;background:#20302a}
.tname{font-weight:700;font-size:14px}.tsc{color:var(--muted);font-size:12px}
.inrow{display:grid;grid-template-columns:52px 1fr 92px;gap:8px;align-items:center;margin-bottom:7px}.inrow .pos{color:var(--muted);font-size:12px}
.chem{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin:10px 0}.chem label{display:block;font-size:12px;color:var(--muted);margin-bottom:3px}.chem input{width:100%}
.sect{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);margin:16px 0 8px;border-top:1px solid var(--line);padding-top:12px}
.meter{margin:11px 0}.meter .head{display:flex;justify-content:space-between;margin-bottom:5px}.meter .name{font-weight:600;font-size:14px}
.scale{display:grid;grid-template-columns:repeat(11,1fr);gap:3px}
.seg{height:22px;border-radius:4px;background:#141b18;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:10px;color:#5c7067}
.seg.on-cer{background:var(--cer);color:#04212e;font-weight:700}.seg.on-som{background:var(--som);color:#2e1601;font-weight:700}.seg.on-ov{background:var(--gold);color:#2c2200;font-weight:700}
.badge{display:inline-block;background:#12211a;border:1px solid var(--green);color:#a6e0b8;padding:5px 12px;border-radius:999px;font-weight:700;font-size:14px;margin:6px 0}
.strength{color:var(--muted);font-size:13px;margin-top:10px}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:10px 18px;font-size:13px;margin-top:6px}
.kv .k{color:var(--muted);font-size:11px}.kv .v{font-weight:600}
.kv .full{grid-column:1 / -1}
.warn{background:#2a1c12;border:1px solid #6b4a2a;color:#e8c9a6;padding:10px 12px;border-radius:8px;font-size:13px;margin-bottom:12px;display:none}

// ================== TRIAX V3 ENGINE (ported from workbook) ==================
const _DBMAP = {}; TERPENE_DB.forEach(t => _DBMAP[t.name] = t);
const CEREBRAL_LABELS = ["deeply suppressed","dulled","mildly clouded","soft","quiet","clear","gently lifted","alert","stimulating","sharp","electric"];
const SOMATIC_LABELS  = ["narcotic, immobilizing","heavy, sedating","deeply relaxed","relaxed","grounded","neutral","subtle body lift","light, mobile","energizing","very energizing","activating"];
const OVERALL_LABELS  = ["Narcotic Gravity (Very Sedating)","Tranquilizing","Sedative","Heavy Hybrid","Grounded / Calm","Balanced","Bright / Light Uplift","Upbeat Hybrid","Functional Stimulating","High Velocity","Electric Cerebral (Very Energizing)"];

function _xround(x){ return Math.sign(x) * Math.round(Math.abs(x) + 1e-9); } // Excel ROUND: half away from zero
function _clamp(x,lo,hi){ return Math.max(lo, Math.min(hi, x)); }
function _strip(n){ if(!n) return ""; if(n.slice(0,5)==="Beta-") return n.slice(5); if(n.slice(0,6)==="Alpha-") return n.slice(6); return n; }
function _look(name){ return _DBMAP[name] || {cerebral:0,somatic:0,threshold:0,volatility:0,density:0,clarity:0,aroma:""}; }
function _num(v){ v=parseFloat(v); return isNaN(v)?0:v; }
function _fix1(v){ return v.toFixed(1); }

function computeTriax(input){
  const t1=input.t1||"", t2=input.t2||"", t3=input.t3||"";
  const p1=_num(input.p1), p2=_num(input.p2), p3=_num(input.p3);
  const thc=_num(input.thc), cbd=_num(input.cbd), totalTerp=_num(input.totalTerp);
  const L1=_look(t1), L2=_look(t2), L3=_look(t3);
  const sumP=p1+p2+p3;
  const names=[t1,t2,t3], pcts=[p1,p2,p3], looks=[L1,L2,L3];

  // Step 1 Base Vector (threshold-gated, %-weighted; else equal weights)
  function base(key){
    if(sumP>0){
      return (p1>=L1.threshold?L1[key]:0)*(p1/sumP)
           + (p2>=L2.threshold?L2[key]:0)*(p2/sumP)
           + (p3>=L3.threshold?L3[key]:0)*(p3/sumP);
    }
    return (L1[key]+L2[key]+L3[key])/3;
  }
  const base_cer=base("cerebral"), base_som=base("somatic");

  // Step 2 Synergy (both terpenes of a pair present)
  const inSet = n => (n===t1)||(n===t2)||(n===t3);
  let syn_cer=0, syn_som=0;
  SYNERGIES.forEach(s=>{ if(inSet(s.a)&&inSet(s.b)){ syn_cer+=s.cer; syn_som+=s.som; }});

  // Step 3 Conflict
  const cerVals=[L1.cerebral,L2.cerebral,L3.cerebral], somVals=[L1.somatic,L2.somatic,L3.somatic];
  const conf_cer=(Math.max(...cerVals)>=4 && Math.min(...cerVals)<=-4)?-1:0;
  const conf_som=(Math.max(...somVals)>=4 && Math.min(...somVals)<=-4)?-1:0;

  // Steps 4-6 Volatility/Clarity -> Cerebral ; Density -> Somatic (negative)
  const vol_cer=L1.volatility+L2.volatility+L3.volatility;
  const cla_cer=L1.clarity+L2.clarity+L3.clarity;
  const den_som=-(L1.density+L2.density+L3.density);

  // Step 7 Raw
  const raw_cer=base_cer+syn_cer+conf_cer+vol_cer+cla_cer;
  const raw_som=base_som+syn_som+conf_som+den_som;
  const raw_ov=(Math.abs(raw_cer)+Math.abs(raw_som)===0)?0:
     (Math.abs(raw_cer)*raw_cer+Math.abs(raw_som)*raw_som)/(Math.abs(raw_cer)+Math.abs(raw_som));

  // Modulators
  const loadMult=_clamp(0.5 + totalTerp/1.5*0.5, 0.5, 1.5);
  const thcAmp=_clamp(1 + (thc-20)/20*0.4, 0.6, 1.4);
  const cbdDamp=(thc===0)?1:Math.max(0.6, 1 - Math.min(1, cbd/thc)*0.4);
  const mod=(x)=>x*loadMult*thcAmp*cbdDamp;

  // Step 8 Final
  const cerebral=_clamp(_xround(mod(raw_cer)),-5,5)+0;
  const somatic =_clamp(_xround(mod(raw_som)),-5,5)+0;
  const overall =_clamp(_xround(mod(raw_ov)),-5,5)+0;

  // Profile type (single-axis lean based on Overall score)
  let profile;
  if(overall>=2) profile="Sativa Leaning";
  else if(overall<=-2) profile="Indica Leaning";
  else profile="Hybrid Leaning";

  // Aroma prominence
  function prom(p){ if(p===0) return "—"; const s=p/sumP; return s>=0.45?"DOMINANT":(s>=0.22?"Supporting":"trace"); }
  const aroma=[0,1,2].map(i=>({terpene:names[i], prominence:sumP>0?prom(pcts[i]):(pcts[i]===0?"—":"trace"), notes:looks[i].aroma}));

  // Sommelier blend (sorted, prefix-stripped)
  const sorted=[_strip(t1),_strip(t2),_strip(t3)].sort((a,b)=>a.localeCompare(b));
  const key=sorted.join("|");
  let blend=BLENDS[key];
  if(blend===undefined){
    const a1=_look(sorted[0]).aroma, a2=_look(sorted[1]).aroma, a3=_look(sorted[2]).aroma;
    const cap = a1 ? (a1.charAt(0).toUpperCase()+a1.slice(1)) : "";
    let s = cap + ", combined with " + a2;
    if(sorted[2] && sorted[2]!=="(none)" && a3) s += ", and " + a3;
    blend = s + ".";
  }

  // Strength read
  let sr="";
  if(totalTerp>=2.5) sr+="Terpene-rich at "+_fix1(totalTerp)+"% total — expect a vivid, pronounced experience. ";
  else if(totalTerp>=1.5) sr+="Moderate terpene load at "+_fix1(totalTerp)+"% total — typical BC flower expression. ";
  else if(totalTerp>0) sr+="Light terpene load at "+_fix1(totalTerp)+"% total — subtle expression. ";
  if(thc>=28) sr+="THC is high at "+_fix1(thc)+"% — effects will lean toward both axis extremes. ";
  else if(thc>=18) sr+="THC at "+_fix1(thc)+"% is typical — predicted effects track the ratings directly. ";
  else if(thc>0) sr+="THC at "+_fix1(thc)+"% is mild — predicted effects may feel gentler than the ratings suggest. ";
  if(thc>0){ const r=cbd/thc;
    if(r>=1) sr+="CBD-dominant chemistry ("+_fix1(cbd)+"% CBD) — expect strongly buffered, mild experience.";
    else if(r>=0.3) sr+="Significant CBD content ("+_fix1(cbd)+"%) — softens both extremes.";
    else if(r>=0.05) sr+="Modest CBD ("+_fix1(cbd)+"%) — slight modulation.";
    else sr+="Trace CBD — negligible modulation.";
  }

  return {
    cerebral, somatic, overall,
    cerebralLabel: CEREBRAL_LABELS[cerebral+5],
    somaticLabel:  SOMATIC_LABELS[somatic+5],
    overallLabel:  OVERALL_LABELS[overall+5],
    profile, aroma, blend, strength: sr,
    debug: { base_cer, base_som, syn_cer, syn_som, conf_cer, conf_som, vol_cer, cla_cer, den_som,
             raw_cer, raw_som, raw_ov, loadMult, thcAmp, cbdDamp }
  };
}

const terpeneNames = TERPENE_DB.map(t=>t.name);
if (typeof module !== "undefined" && module.exports) {
  module.exports = { computeTriax, TERPENE_DB, SYNERGIES, BLENDS, terpeneNames,
                     CEREBRAL_LABELS, SOMATIC_LABELS, OVERALL_LABELS };
}

function brandLogo(name){ return name?BRANDS[name.toLowerCase()]||"":""; }

// mg/g -> %; leave % and mg as-is
function cannab(minv,maxv,uom){
  const conv=v=>{ if(v===null||v===undefined||v==="")return null; v=parseFloat(v); if(!isFinite(v))return null;
    const u=(uom||"").toLowerCase();
    if(u.includes("mg/g")) return {n:v/10,u:"%"};
    if(u==="mg") return {n:v,u:" mg"};
    return {n:v,u:"%"}; };
  const a=conv(minv),b=conv(maxv); if(!a&&!b) return "—";
  const u=(b||a).u, f=x=>Number.isInteger(x.n)?x.n:(+x.n.toFixed(1));
  return (a&&b)?`${f(a)}–${f(b)}${u}`:`${f(a||b)}${u}`;
}

    ${p.short_description?`<div class="shortdesc">${p.short_description}</div>`:""}
    <div class="sect">Terpene trio (catalog)</div>
    ${t.map(terpCard).join("")||'<div class="muted">No terpenes listed.</div>'}
    <div class="sect">This batch — enter from the package</div>
    <div class="inrow"><span class="pos">1st</span><select id="d_t1">${opts}</select><input id="d_p1" type="number" step="0.01" placeholder="%"></div>
    <div class="inrow"><span class="pos">2nd</span><select id="d_t2">${opts}</select><input id="d_p2" type="number" step="0.01" placeholder="%"></div>
    <div class="inrow"><span class="pos">3rd</span><select id="d_t3">${opts}</select><input id="d_p3" type="number" step="0.01" placeholder="%"></div>
    <div class="chem"><div><label>THC %</label><input id="d_thc" type="number" step="0.1"></div>
      <div><label>CBD %</label><input id="d_cbd" type="number" step="0.1"></div>
      <div><label>Total terpenes %</label><input id="d_tt" type="number" step="0.1"></div></div>
    <div class="sect">Effect read-out</div><div id="d_out"></div>
    <div class="sect">Product details</div>
    <div class="kv">
      ${kv("SKU",p.sku)}${kv("Catalog",p.catalog_source)}
      ${kv("Category",p.category)}${kv("Strain type",p.species)}
      ${kv("Unit count",p.num_consumer_items)}${kv("Size / unit",sizeU||"—")}
      ${kv("Province",p.origin_region)}${kv("Subregion",raw.ORIGIN_SUBREGION)}
      ${kv("THC",thc)}${kv("CBD",cbd)}
      ${kv("Lifecycle",p.lifecycle_status)}${kv("Country",p.origin_country||raw.ORIGIN_COUNTRY)}
      ${p.long_description?`<div class="full">${kv("Description",p.long_description)}</div>`:""}
    </div>`;
  document.getElementById("d_t1").value=t[0];document.getElementById("d_t2").value=t[1];document.getElementById("d_t3").value=t[2];
  ["d_t1","d_t2","d_t3","d_p1","d_p2","d_p3","d_thc","d_cbd","d_tt"].forEach(id=>document.getElementById(id).addEventListener("input",recompute));
  recompute();
  document.getElementById("ov").classList.add("on");
}
function recompute(){const i={t1:d_t1.value,t2:d_t2.value,t3:d_t3.value,p1:d_p1.value,p2:d_p2.value,p3:d_p3.value,thc:d_thc.value,cbd:d_cbd.value,totalTerp:d_tt.value};
  const r=computeTriax(i);
  document.getElementById("d_out").innerHTML=meterRow("Cerebral",r.cerebral,"on-cer")+meterRow("Somatic",r.somatic,"on-som")+meterRow("Overall",r.overall,"on-ov")
    +`<div>Profile: <span class="badge">${r.profile}</span></div><div class="strength">${r.strength||"Enter this batch's percentages to sharpen the prediction."}</div>`;}
document.getElementById("ov").onclick=e=>{if(e.target.id==="ov")e.currentTarget.classList.remove("on");};
qEl.addEventListener("input",()=>{clearTimeout(timer);timer=setTimeout(search,250);});
srcEl.addEventListener("change",search);
(async()=>{ await loadBrands(); search(); })();
</script></body></html>
